<!-- 架空サイト(撮影用の小道具)。予約・会員情報はどこにも送信されず、ブラウザの外には出ません。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: a plain, bright accommodation-search site (prop for filming): top search → results → hotel detail → plans → booking → confirmation. One light look on purpose. */
:root{
  color-scheme:light;
  --brand:#1556B8; --brand-d:#0E3F8E; --brand-l:#EAF1FD; --accent:#E5500B; --star:#F2A20C;
  --ink:#1F2933; --muted:#667085; --line:#E1E5EA; --bg:#F4F6F9; --surface:#FFFFFF; --ok:#13804F; --alert:#C8281E;
  --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:70}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7DB0FF;outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--surface);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:16px;height:56px}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--brand);font-weight:700;font-size:14px;padding:6px 10px 6px 2px;margin-right:-6px;border-radius:6px;white-space:nowrap}
.back[hidden]{display:none}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.back:hover{background:var(--brand-l)}
.bbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:21px;letter-spacing:.04em;color:var(--brand);white-space:nowrap}

/* detail */

.stk{display:none}

  const ridge=(b,a,n)=>{const p=[];for(let i=0;i<=n;i++)p.push([W*i/n,b-a*(.3+.7*R())*(i%2?.78:1)]);return p};
  const poly=(p,c)=>`<polygon points="${p.map(q=>f1(q[0])+','+f1(q[1])).join(' ')} ${W},${H} 0,${H}" fill="${c}"/>`;
  const cap=(p,c)=>`<polygon points="${p.map(q=>f1(q[0])+','+f1(q[1])).join(' ')} ${p.slice().reverse().map(q=>f1(q[0])+','+f1(q[1]+7+R()*14)).join(' ')}" fill="${c}" opacity=".9"/>`;
  const far=ridge(H*(.5+(o.sink||0)),H*.3,7),mid=ridge(H*(.62+(o.sink||0)*.8),H*.22,9),gy=H*(.76+(o.sink||0)*.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${M.sky[0]}"/><stop offset="1" stop-color="${M.sky[1]}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${gid})"/>`;
  s+=poly(far,M.far)+cap(far,M.snow)+poly(mid,M.mid)+cap(mid,M.snow);
  s+=`<path d="M0 ${f1(gy)} Q ${f1(W*.3)} ${f1(gy-H*.05)} ${f1(W*.55)} ${f1(gy-H*.01)} T ${W} ${f1(gy-H*.03)} V${H} H0Z" fill="${M.snow}"/>`;
  // inn building
  const bw=o.big?150:130,bx=W*(.18+R()*.5),by=H*.86,bh=H*.2;
  s+=`<rect x="${f1(bx)}" y="${f1(by-bh)}" width="${bw}" height="${f1(bh)}" fill="#6b4f3a"/><rect x="${f1(bx+6)}" y="${f1(by-bh-16)}" width="${bw-12}" height="16" fill="#3d4a5c"/><polygon points="${f1(bx-8)},${f1(by-bh-16)} ${f1(bx+bw/2)},${f1(by-bh-46)} ${f1(bx+bw+8)},${f1(by-bh-16)}" fill="${M.snow}"/>`;
  for(let k=0;k<6;k++){s+=`<rect x="${f1(bx+10+k*((bw-20)/6))}" y="${f1(by-bh+8)}" width="12" height="${f1(bh*.45)}" fill="${M.glow}" opacity=".9"/>`}
  s+=`<rect x="${f1(bx+bw/2-9)}" y="${f1(by-bh*.42)}" width="18" height="${f1(bh*.42)}" fill="#2c2318"/>`;
  s+=`<g class="steam"><ellipse cx="${f1(bx+bw+16)}" cy="${f1(by-bh-26)}" rx="10" ry="12" fill="#fff" opacity=".45"/></g>`;
  for(let i=0;i<22;i++)s+=`<circle cx="${f1(R()*W)}" cy="${f1(R()*H*.8)}" r="${f1(.7+R()*1.1)}" fill="#fff" opacity="${f1(.4+R()*.45)}"/>`;
  return s+'</svg>';
}

function addDays(isoStr,n){const [y,m,d]=isoStr.split('-').map(Number),x=new Date(y,m-1,d+n);return iso(x)}

function parse(){const h=location.hash.slice(1);let m;
  if((m=h.match(/^hotel-([a-z]+)$/)))return{v:'hotel',id:m[1]};
  if((m=h.match(/^book-([a-z]+)-([a-z]+)$/)))return{v:'book',id:m[1],pid:m[2]};
  if(h==='list')return{v:'list'};if(h==='done')return{v:'done'};if(h==='plans')return{v:'keep'};return{v:'home'}}
let lastRoute='';
function render(){
  const r=parse();if(r.v==='keep')return;
  const key=location.hash;$('#hdBack').hidden=(r.v==='home');
  if(r.v==='home')viewHome();else if(r.v==='list')viewList();else if(r.v==='hotel')viewHotel(r.id);else if(r.v==='book')viewBook(r.id,r.pid);else viewDone();
  if(key!==lastRoute){window.scrollTo(0,0)}lastRoute=key;
}
const normH=()=>location.hash.replace(/^#$/,'');
let navStack=[normH()];
function onNav(){const h=normH(),n=navStack.length;if(n>1&&navStack[n-2]===h)navStack.pop();else if(navStack[n-1]!==h)navStack.push(h);render()}
addEventListener('hashchange',onNav);
function goBack(){
  const n=navStack.length;
  if(n>1){location.hash=navStack[n-2].replace(/^#/,'');return}
  const r=parse(),t=r.v==='hotel'?'list':r.v==='book'?'hotel-'+r.id:'';
  navStack=[t?'#'+t:''];
  if(normH()===(t?'#'+t:''))render();else location.hash=t;
}

function go(h){if(location.hash.slice(1)===h)render();else location.hash=h}
document.addEventListener('submit',e=>{
  if(e.target.id==='sf'){e.preventDefault();S.area=$('#sArea').value;S.date=$('#sDate').value||S.date;S.nights=+$('#sNights').value;S.adults=+$('#sAdults').value;saveS();FL={tag:'',max:'',sort:FL.sort};go('list');return}
  if(e.target.id==='bf'){e.preventDefault();const r=parse(),F=BK.form;BK.touched=true;F.name=$('#bName').value.trim();F.kana=$('#bKana').value.trim();F.tel=$('#bTel').value.trim();F.mail=$('#bMail').value.trim();F.arrive=$('#bArr').value;F.memo=$('#bMemo').value;
    const d=new Date(),no='YT'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+'-'+String(Math.floor(10000+Math.random()*89999));
    BK.result=Object.assign({id:r.id,pid:r.pid,date:S.date,nights:S.nights,adults:S.adults,no},F);go('done')}
});
document.addEventListener('click',e=>{
  const t=e.target;
  const me=t.closest('#hdMe');if(me){const m=$('#meMenu');m.hidden=!m.hidden;me.setAttribute('aria-expanded',String(!m.hidden));return}
  const mi=t.closest('#meMenu button');if(mi){if(mi.hasAttribute('data-logout'))setUser({on:false});else $('#meMenu').hidden=true;return}
  if(!t.closest('#hdAuth')){const m=$('#meMenu');if(m){m.hidden=true;$('#hdMe').setAttribute('aria-expanded','false')}}
  if(t.closest('#logo')||t.closest('#hdLogin')||t.closest('#hdJoin')){e.preventDefault();if(t.closest('#logo'))go('');else if(t.closest('#hdLogin'))setUser({on:true});return}
  if(t.closest('#hdBack')||t.closest('[data-back]')){e.preventDefault();goBack();return}
  const tl=t.closest('[data-tile]');if(tl){const T=$('.tiles').__T[+tl.dataset.tile];S.area='';saveS();FL={tag:T[1]==='tag'?T[2]:'',max:T[1]==='max'?T[2]:'',sort:'rec'};go('list');return}
  const ar=t.closest('[data-area]');if(ar){S.area=ar.dataset.area;saveS();FL={tag:'',max:'',sort:FL.sort};go('list');return}
  const al=t.closest('[data-area-link]');if(al){S.area=al.dataset.areaLink;saveS();return}
  const tg=t.closest('[data-tag]');if(tg){FL.tag=FL.tag===tg.dataset.tag?'':tg.dataset.tag;viewList();return}
  const mx=t.closest('[data-max]');if(mx){FL.max=FL.max===mx.dataset.max?'':mx.dataset.max;viewList();return}
  if(t.closest('#resetF')){FL={tag:'',max:'',sort:'rec'};S.area='';saveS();viewList();return}
  const gl=t.closest('[data-gal]');if(gl){const i=+gl.dataset.gal,h=H(parse().id);$('#galBig').innerHTML=pic(h,i,{big:true})+`<span class="cap" id="galCap">${PH_LABEL[i]}</span>`;$$('[data-gal]').forEach(b=>b.setAttribute('aria-current',String(b===gl)));return}
  const gp=t.closest('[data-go="plans"]');if(gp){e.preventDefault();$('#plans').scrollIntoView({block:'start'});return}
  if(t.closest('#editBtn')){const n=Date.now();tapN=(n-tapT<900)?tapN+1:1;tapT=n;if(tapN>=3){tapN=0;openEdit()}return}
  if(t===$('#ov'))closeEdit();
});

  sheet.innerHTML=`<h2 id="edTitle">撮影用設定</h2><p class="help">画面に映したい内容に合わせて、サイト名・宿名・料金・写真を変えられます。この端末のブラウザに保存されます。</p>
  <div class="ed"><div class="fld"><label for="edSite">サイト名</label><input id="edSite" value="${esc(EDIT.site||'ゆきたび')}" maxlength="14"></div>
  <div style="display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px"><label class="chk"><input type="checkbox" id="edUOn"${u.on?' checked':''}><span>ログイン済みの状態で表示する<br><small style="color:var(--muted)">右上に会員名とポイントが出て、予約画面の入力欄も会員情報で埋まります。外すと未ログインの表示になります。</small></span></label>
   <div class="row2"><div class="fld"><label for="edUN">会員のお名前</label><input id="edUN" value="${esc(u.name)}" maxlength="16"></div><div class="fld"><label for="edUK">フリガナ</label><input id="edUK" value="${esc(u.kana)}" maxlength="24"></div></div>
   <div class="row2"><div class="fld"><label for="edUT">電話番号</label><input id="edUT" value="${esc(u.tel)}" maxlength="16"></div><div class="fld"><label for="edUM">メールアドレス</label><input id="edUM" value="${esc(u.mail)}" maxlength="40"></div></div>
   <div class="fld"><label for="edUP">ポイント</label><input id="edUP" type="number" min="0" step="10" value="${+u.points||0}"></div></div>
  <div class="fld"><label for="edH">変更する宿</label><select id="edH">${BASE.map(b=>`<option value="${b.id}"${b.id===edId?' selected':''}>${esc(H(b.id).name)}</option>`).join('')}</select></div>
  <div class="row2"><div class="fld"><label for="edName">宿名</label><input id="edName" value="${esc(h.name)}"></div><div class="fld"><label for="edArea">温泉地</label><input id="edArea" value="${esc(h.area)}"></div></div>
  <div class="row2"><div class="fld"><label for="edPrice">料金（1泊2食・大人1名・円）</label><input id="edPrice" type="number" min="1000" step="100" value="${h.price}"></div><div class="fld"><label for="edRate">評価（1〜5）</label><input id="edRate" type="number" min="1" max="5" step="0.1" value="${h.rating}"></div></div>
  <div class="fld"><label for="edRev">クチコミ件数</label><input id="edRev" type="number" min="1" step="1" value="${h.reviews}"></div>
  <div><span class="sub">ホームの写真（トップ画像と、冬の温泉特集の4枚）</span><div class="ph4 ph5">${HOME_LABEL.map((lb,k)=>`<div class="slot"><div class="pv">${homePic(k,k===0?sceneOutside('home-hero','day',{sink:.18,big:true}):pic(H(['ginzan','kinosaki','okuhida','zao'][k-1]),0))}</div><label for="edHp${k}">${lb}</label><input id="edHp${k}" type="file" accept="image/*" data-hp="${k}">${homeUrl(k)?`<button type="button" data-hdel="${k}">元に戻す</button>`:'<span style="height:18px"></span>'}</div>`).join('')}</div></div>
  <div><span class="sub">宿の写真（上で選んだ宿。ホームの「今週の人気の宿」と宿のページに使われます）</span><div class="ph4">${[0,1,2,3].map(i=>`<div class="slot"><div class="pv">${pic(h,i)}</div><label for="edP${i}">${PH_LABEL[i]}を選ぶ</label><input id="edP${i}" type="file" accept="image/*" data-p="${i}">${photos[edId]&&photos[edId][i]?`<button type="button" data-pdel="${i}">元に戻す</button>`:'<span style="height:18px"></span>'}</div>`).join('')}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between"><button type="button" class="btn ghost sm" id="edReset">この宿を初期状態に戻す</button><button type="button" class="btn blue sm" id="edClose">閉じる</button></div>
  <p class="help" style="margin:2px 0 0">この設定画面は、ページの一番下（スクロールして最後）の<b>左下</b>を素早く3回タップするか、URLの末尾に <b>?edit</b> を付けて開くと表示されます。</p></div>`;
}
sheet.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='edSite'){EDIT.site=e.target.value;applySite();applyUser();saveEdit();return}
  const um={edUN:'name',edUK:'kana',edUT:'tel',edUM:'mail',edUP:'points'};
  if(um[id]){EDIT.user=Object.assign(U(),{[um[id]]:id==='edUP'?Math.max(0,+e.target.value||0):e.target.value});saveEdit();applyUser();return}
  const map={edName:'name',edArea:'area',edPrice:'price',edRate:'rating',edRev:'reviews'};
  if(map[id]){const o=EDIT.h[edId]||(EDIT.h[edId]={});o[map[id]]=e.target.value;saveEdit()}
});
sheet.addEventListener('change',e=>{
  if(e.target.id==='edH'){edId=e.target.value;paintEdit();return}
  if(e.target.id==='edUOn'){EDIT.user=Object.assign(U(),{on:e.target.checked});saveEdit();applyUser();return}
  const hp=e.target.dataset.hp;if(hp!=null&&e.target.files&&e.target.files[0]){readHome(e.target.files[0],+hp);return}
  const i=e.target.dataset.p;if(i!=null&&e.target.files&&e.target.files[0])readPhoto(e.target.files[0],+i)
});
sheet.addEventListener('click',e=>{
  if(e.target.closest('#edClose')){closeEdit();return}
  if(e.target.closest('#edReset')){delete EDIT.h[edId];delete photos[edId];saveEdit();store.set('yukitabi-photos-v1',photos);paintEdit();return}
  const hd=e.target.closest('[data-hdel]');if(hd){if(photos._home){const nx=photos._home.slice();nx[+hd.dataset.hdel]=null;const all=Object.assign({},photos,{_home:nx});store.set('yukitabi-photos-v1',all);photos=all}paintEdit();return}
  const d=e.target.closest('[data-pdel]');if(d){if(photos[edId]){photos[edId][+d.dataset.pdel]=null;store.set('yukitabi-photos-v1',photos)}paintEdit()}
});
function readHome(file,k){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const max=k===0?1800:960,k2=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k2);c.height=Math.round(img.height*k2);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const data=c.toDataURL('image/jpeg',k===0?.8:.74),prev=photos._home?photos._home.slice():[null,null,null,null,null];prev[k]=data;const next=Object.assign({},photos,{_home:prev});
    if(store.set('yukitabi-photos-v1',next)){photos=next;paintEdit()}else toast('容量がいっぱいです。他の写真を戻してください')};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('画像を読み込めませんでした')};
  img.src=url;
}
function readPhoto(file,i){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const max=960,k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const data=c.toDataURL('image/jpeg',.74),prev=photos[edId]?photos[edId].slice():[null,null,null,null];prev[i]=data;const next=Object.assign({},photos,{[edId]:prev});
    if(store.set('yukitabi-photos-v1',next)){photos=next;paintEdit()}else toast('容量がいっぱいです。他の写真を戻してください')};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('画像を読み込めませんでした')};
  img.src=url;
}

/* ---------- boot ---------- */
applySite();applyUser();render();
if(/[?&]edit(?:[=&]|$)/.test(location.search))openEdit();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$('#meMenu');if(m&&!m.hidden){m.hidden=true;$('#hdMe').setAttribute('aria-expanded','false');$('#hdMe').focus()}}});
window.__yt={S,H,plans,render};
})();
</script>
</body>
</html>
